<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Gallery</title>
    <link rel="icon" type="image/png" href="png/folder.png"/>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
<div class="container">
    <!-- En-tête avec le titre et l'icône Tumblr côte à côte -->
    <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 5px;">
        <h1 style="margin: 0;">My Gallery</h1> 
        <a href="https://creatreasurebox.tumblr.com/" target="_blank" title="Mon Tumblr">
            <img class="tumblricon" src="png/TumblrIcon.png" alt="Tumblr" style="width: 40px; height: 40px; object-fit: cover; border-radius: 8px; transition: 0.2s;">
        </a>
    </div>
    
    <!-- Disclaimer sous le titre -->
    <p class="disclaimer">Merci de réhéberger ces images en les téléchargeants. / Please re-host these images by downloading them.</br>
    credit : Chaussette </p>

    <!-- caché au départ -->
    <div class="toolbar">
        <button id="back" class="hidden">
            ← Retour
        </button>

        <!-- fil d'ariane -->
        <span id="breadcrumb"></span>
    </div>
    <!-- pour afficher les dossiers et les images -->
    <div id="gallery"></div>
</div>

<div id="preview" class="preview hidden">
    <div class="preview-content">
        <button id="prevImage" class="nav prev">←</button>

        <img id="previewImage" src="" alt="">

        <button id="nextImage" class="nav next">→</button>
    </div>
</div>

<script src="./script.js"></script>
</body>
</html>
